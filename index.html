<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modal Popup Example</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button id="openModalBtn">Mở Hộp Thoại</button>

    <div id="myModal" class="modal">
      <div class="modal-content">
        <span class="close-button">&times;</span>
        <h2>Chào mừng bạn đến với Hộp Thoại!</h2>
        <p>
          Đây là nội dung của hộp thoại bật lên. Bạn có thể đặt bất kỳ thông tin
          nào ở đây.
        </p>
        <button id="closeModalInsideBtn">Đóng</button>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
